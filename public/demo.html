<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ignimetheus — 28s Microgravity Fire Screening Demo</title>
  <meta name="description" content="Watch the 28-second narrated pitch for Ignimetheus: an offline, browser-based flame-spread screening and teaching simulator for microgravity spacecraft fires." />
  <meta name="theme-color" content="#000000" />

  <!-- Open Graph -->
  <meta property="og:type" content="video.other" />
  <meta property="og:title" content="Ignimetheus — 28s Microgravity Fire Screening Demo" />
  <meta property="og:description" content="Watch the 28-second narrated pitch for Ignimetheus: an offline, browser-based flame-spread screening and teaching simulator for microgravity spacecraft fires." />
  <meta property="og:video" content="/demo.mp4" />
  <meta property="og:video:type" content="video/mp4" />
  <meta property="og:video:width" content="1280" />
  <meta property="og:video:height" content="720" />
  <meta property="og:image" content="/pwa-512x512.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ignimetheus — 28s Microgravity Fire Screening Demo" />
  <meta name="twitter:description" content="Watch the 28-second narrated pitch for Ignimetheus: an offline, browser-based flame-spread screening and teaching simulator for microgravity spacecraft fires." />
  <meta name="twitter:image" content="/pwa-512x512.png" />

  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-void: #000000;
      --text-primary: #F5F5F2;
      --text-muted: rgba(245, 245, 242, 0.75);
      --text-subtle: rgba(245, 245, 242, 0.5);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    /* Fullscreen Theater Stage */
    #video-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video-container.cursor-hidden {
      cursor: none;
    }

    #pitch-video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100dvh;
      object-fit: contain;
      background-color: #000000;
      display: block;
      cursor: pointer;
    }

    /* Minimal Pre-Play Start Overlay */
    #launch-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(7, 8, 11, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 220ms cubic-bezier(0.16, 1, 0.3, 1), visibility 220ms;
      padding: 24px;
    }

    #launch-overlay.is-dismissed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .editorial-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .launch-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(245, 245, 242, 0.62);
    }

    .launch-heading {
      font-family: var(--font-sans);
      font-size: clamp(28px, 3vw, 32px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
      color: #F5F5F2;
      text-wrap: balance;
      margin-bottom: 6px;
    }

    .primary-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #F5F5F2;
      color: #070707;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      padding: 11px 24px;
      border-radius: 999px;
      border: none;
      text-decoration: none;
      cursor: pointer;
      transition: transform 150ms cubic-bezier(0.16, 1, 0.3, 1), background-color 150ms ease, opacity 150ms ease;
    }

    .primary-pill-btn:hover {
      background: #FFFFFF;
      transform: translateY(-1px);
    }

    .primary-pill-btn:active {
      transform: translateY(0);
    }

    .primary-pill-btn:focus-visible {
      outline: 2px solid #F5F5F2;
      outline-offset: 3px;
    }

    /* Minimal Centered Glassmorphic End Overlay */
    #end-slate {
      position: absolute;
      inset: 0;
      z-index: 32;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(7, 8, 11, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms cubic-bezier(0.16, 1, 0.3, 1), visibility 220ms;
      padding: 24px;
    }

    #end-slate.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .end-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    .end-heading {
      font-family: var(--font-sans);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #F5F5F2;
    }

    .end-btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .end-pill-primary,
    .end-pill-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      padding: 0 22px;
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 150ms cubic-bezier(0.16, 1, 0.3, 1), background-color 150ms ease, border-color 150ms ease;
    }

    .end-pill-primary {
      background: #F5F5F2;
      color: #070707;
      border: 1px solid transparent;
    }

    .end-pill-primary:hover {
      background: #FFFFFF;
      transform: translateY(-1px);
    }

    .end-pill-secondary {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #F5F5F2;
    }

    .end-pill-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
    }

    .end-repo-link {
      font-family: var(--font-mono);
      font-size: 12px;
      color: rgba(245, 245, 242, 0.5);
      text-decoration: none;
      transition: color 150ms ease;
    }

    .end-repo-link:hover {
      color: #F5F5F2;
    }

    /* Single-Row Floating Glassmorphic Capsule Dock */
    #transport-bar {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      margin: 0 auto;
      z-index: 28;
      width: min(860px, calc(100% - 48px));
      height: 46px;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(15, 17, 23, 0.58);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
      transition: opacity 200ms cubic-bezier(0.16, 1, 0.3, 1), transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #transport-bar.is-hidden {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #F5F5F2;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 140ms ease, opacity 140ms ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .icon-btn:focus-visible {
      outline: 2px solid rgba(245, 245, 242, 0.65);
      outline-offset: 1px;
    }

    .time-readout {
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: rgba(245, 245, 242, 0.75);
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* Timeline Scrub Bar (flex: 1, 4px track) */
    .scrub-container {
      position: relative;
      flex: 1;
      min-width: 80px;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .scrub-rail {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    #buffer-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      pointer-events: none;
    }

    #play-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: #F5F5F2;
      border-radius: 999px;
      pointer-events: none;
    }

    #scrub-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #F5F5F2;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .scrub-container:hover #scrub-thumb {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    #scrub-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }

    #hover-preview {
      position: absolute;
      bottom: 26px;
      left: 0;
      transform: translateX(-50%);
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(15, 17, 23, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #F5F5F2;
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      opacity: 0;
      transition: opacity 100ms ease;
      white-space: nowrap;
    }

    .scrub-container:hover #hover-preview {
      opacity: 1;
    }

    .volume-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #volume-slider {
      width: 52px;
      height: 4px;
      accent-color: #F5F5F2;
      cursor: pointer;
    }

    .dock-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.14);
      flex-shrink: 0;
    }

    .open-sim-action {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      color: #F5F5F2;
      text-decoration: none;
      letter-spacing: -0.01em;
      flex-shrink: 0;
      white-space: nowrap;
      transition: opacity 140ms ease;
    }

    .open-sim-action:hover {
      opacity: 0.8;
    }

    @media (max-width: 640px) {
      #transport-bar {
        width: calc(100% - 24px);
        bottom: 14px;
        gap: 10px;
        padding: 0 12px;
      }
      #volume-slider {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main id="video-container" data-testid="demo-video-stage">
    <!-- Primary HTML5 Video Element (First-frame metadata preloaded) -->
    <video
      id="pitch-video"
      src="/demo.mp4"
      preload="metadata"
      playsinline
      aria-label="Ignimetheus 28-second narrated microgravity fire screening demo"
    ></video>

    <!-- Minimal Editorial Start Overlay -->
    <section id="launch-overlay" aria-label="Start narrated pitch">
      <div class="editorial-stack">
        <div class="launch-kicker">IGNIMETHEUS · 0:28 OVERVIEW</div>
        <h1 class="launch-heading">Microgravity Flame-Spread Screening</h1>
        <button type="button" id="start-pitch-btn" class="primary-pill-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5.14v14l11-7-11-7z" />
          </svg>
          <span>Play Pitch</span>
        </button>
      </div>
    </section>

    <!-- Minimal Centered Glassmorphic End Overlay -->
    <section id="end-slate" aria-label="Pitch complete actions">
      <div class="end-stack">
        <h2 class="end-heading">Ignimetheus</h2>
        <div class="end-btn-row">
          <a href="/" id="launch-sim-end-btn" class="end-pill-primary">
            <span>Open Simulator →</span>
          </a>
          <button type="button" id="replay-pitch-btn" class="end-pill-secondary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            <span>Replay</span>
          </button>
        </div>
        <a
          href="https://github.com/Zucloak/Ignimetheus"
          target="_blank"
          rel="noopener noreferrer"
          id="github-repo-btn"
          class="end-repo-link"
        >
          github.com/Zucloak/Ignimetheus
        </a>
      </div>
    </section>

    <!-- Single-Row Floating Glassmorphic Capsule Dock -->
    <nav id="transport-bar" aria-label="Video player controls">
      <button
        type="button"
        id="play-pause-btn"
        class="icon-btn"
        aria-label="Play"
        title="Play / Pause (Space or K)"
      >
        <svg id="icon-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5.14v14l11-7-11-7z" />
        </svg>
        <svg id="icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none" aria-hidden="true">
          <path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z" />
        </svg>
      </button>

      <div id="time-readout" class="time-readout" aria-live="off">
        <span id="cur-time">0:00</span> / <span id="dur-time">0:28</span>
      </div>

      <div id="scrub-track" class="scrub-container">
        <div class="scrub-rail">
          <div id="buffer-fill"></div>
          <div id="play-fill"></div>
        </div>
        <div id="scrub-thumb"></div>
        <div id="hover-preview">0:00</div>
        <input
          type="range"
          id="scrub-input"
          min="0"
          max="28.5"
          step="0.05"
          value="0"
          aria-label="Seek timeline"
        />
      </div>

      <div class="volume-group">
        <button
          type="button"
          id="mute-btn"
          class="icon-btn"
          aria-label="Mute"
          title="Mute / Unmute (M)"
        >
          <svg id="icon-vol-on" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
          <svg id="icon-vol-off" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <line x1="23" y1="9" x2="17" y2="15" />
            <line x1="17" y1="9" x2="23" y2="15" />
          </svg>
        </button>
        <input
          type="range"
          id="volume-slider"
          min="0"
          max="1"
          step="0.05"
          value="1"
          aria-label="Volume"
        />
      </div>

      <button
        type="button"
        id="fullscreen-btn"
        class="icon-btn"
        aria-label="Toggle Fullscreen"
        title="Toggle Fullscreen (F)"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
        </svg>
      </button>

      <span class="dock-divider" aria-hidden="true"></span>

      <a href="/" id="open-sim-nav-btn" class="open-sim-action">
        Open Simulator →
      </a>
    </nav>
  </main>

  <script>
    (function () {
      const container = document.getElementById('video-container');
      const video = document.getElementById('pitch-video');
      const launchOverlay = document.getElementById('launch-overlay');
      const startPitchBtn = document.getElementById('start-pitch-btn');
      const endSlate = document.getElementById('end-slate');
      const replayPitchBtn = document.getElementById('replay-pitch-btn');
      const transportBar = document.getElementById('transport-bar');

      const playPauseBtn = document.getElementById('play-pause-btn');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');

      const scrubTrack = document.getElementById('scrub-track');
      const scrubInput = document.getElementById('scrub-input');
      const bufferFill = document.getElementById('buffer-fill');
      const playFill = document.getElementById('play-fill');
      const scrubThumb = document.getElementById('scrub-thumb');
      const hoverPreview = document.getElementById('hover-preview');

      const curTimeEl = document.getElementById('cur-time');
      const durTimeEl = document.getElementById('dur-time');

      const muteBtn = document.getElementById('mute-btn');
      const iconVolOn = document.getElementById('icon-vol-on');
      const iconVolOff = document.getElementById('icon-vol-off');
      const volumeSlider = document.getElementById('volume-slider');
      const fullscreenBtn = document.getElementById('fullscreen-btn');

      let idleTimer = null;
      let isHoveringControls = false;

      function formatTimecode(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
        const totalSecs = Math.floor(seconds);
        const mins = Math.floor(totalSecs / 60);
        const secs = totalSecs % 60;
        return mins + ':' + (secs < 10 ? '0' + secs : String(secs));
      }

      function getDuration() {
        return Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 28.5;
      }

      function updateTimelineUI() {
        const dur = getDuration();
        const cur = Math.min(dur, Math.max(0, video.currentTime || 0));
        const pct = dur > 0 ? (cur / dur) * 100 : 0;

        scrubInput.max = String(dur);
        scrubInput.value = String(cur);
        playFill.style.width = pct.toFixed(2) + '%';
        scrubThumb.style.left = pct.toFixed(2) + '%';

        curTimeEl.textContent = formatTimecode(cur);
        durTimeEl.textContent = formatTimecode(dur);
      }

      function updateBufferUI() {
        const dur = getDuration();
        if (dur <= 0 || !video.buffered || video.buffered.length === 0) return;
        const bufferedEnd = video.buffered.end(video.buffered.length - 1);
        const pct = Math.min(100, Math.max(0, (bufferedEnd / dur) * 100));
        bufferFill.style.width = pct.toFixed(2) + '%';
      }

      function updatePlayPauseUI() {
        const playing = !video.paused && !video.ended;
        iconPlay.style.display = playing ? 'none' : 'block';
        iconPause.style.display = playing ? 'block' : 'none';
        playPauseBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      }

      function updateVolumeUI() {
        const muted = video.muted || video.volume === 0;
        iconVolOn.style.display = muted ? 'none' : 'block';
        iconVolOff.style.display = muted ? 'block' : 'none';
        muteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
        volumeSlider.value = muted ? '0' : String(video.volume);
      }

      function showControlsAndScheduleHide() {
        transportBar.classList.remove('is-hidden');
        container.classList.remove('cursor-hidden');

        if (idleTimer) {
          window.clearTimeout(idleTimer);
          idleTimer = null;
        }

        if (!video.paused && !video.ended && !isHoveringControls) {
          idleTimer = window.setTimeout(function () {
            if (!video.paused && !video.ended && !isHoveringControls) {
              transportBar.classList.add('is-hidden');
              container.classList.add('cursor-hidden');
            }
          }, 2000);
        }
      }

      function startPlaybackWithSound(resetToStart) {
        launchOverlay.classList.add('is-dismissed');
        endSlate.classList.remove('is-visible');
        if (resetToStart) {
          video.currentTime = 0;
        }
        video.muted = false;
        if (video.volume === 0) {
          video.volume = 1;
        }
        updateVolumeUI();
        const playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function () {
            updatePlayPauseUI();
          });
        }
        showControlsAndScheduleHide();
      }

      function togglePlayPause() {
        if (!launchOverlay.classList.contains('is-dismissed')) {
          startPlaybackWithSound(false);
          return;
        }
        if (video.ended) {
          startPlaybackWithSound(true);
          return;
        }
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
        showControlsAndScheduleHide();
      }

      function toggleMute() {
        if (video.muted) {
          video.muted = false;
          if (video.volume === 0) video.volume = 1;
        } else {
          video.muted = true;
        }
        updateVolumeUI();
        showControlsAndScheduleHide();
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          if (container.requestFullscreen) {
            container.requestFullscreen().catch(function () {});
          }
        } else if (document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        }
        showControlsAndScheduleHide();
      }

      function seekRelative(deltaSeconds) {
        const dur = getDuration();
        const nextTime = Math.min(dur, Math.max(0, (video.currentTime || 0) + deltaSeconds));
        video.currentTime = nextTime;
        if (nextTime < dur) {
          endSlate.classList.remove('is-visible');
        }
        updateTimelineUI();
        showControlsAndScheduleHide();
      }

      // Event Listeners
      startPitchBtn.addEventListener('click', function () {
        startPlaybackWithSound(true);
      });

      replayPitchBtn.addEventListener('click', function () {
        startPlaybackWithSound(true);
      });

      video.addEventListener('click', function () {
        togglePlayPause();
      });

      playPauseBtn.addEventListener('click', function () {
        togglePlayPause();
      });

      muteBtn.addEventListener('click', function () {
        toggleMute();
      });

      volumeSlider.addEventListener('input', function () {
        const val = parseFloat(volumeSlider.value);
        video.volume = Number.isFinite(val) ? Math.min(1, Math.max(0, val)) : 1;
        video.muted = video.volume === 0;
        updateVolumeUI();
        showControlsAndScheduleHide();
      });

      fullscreenBtn.addEventListener('click', function () {
        toggleFullscreen();
      });

      scrubInput.addEventListener('input', function () {
        const val = parseFloat(scrubInput.value);
        if (Number.isFinite(val)) {
          launchOverlay.classList.add('is-dismissed');
          video.currentTime = val;
          if (val < getDuration()) {
            endSlate.classList.remove('is-visible');
          }
          updateTimelineUI();
        }
        showControlsAndScheduleHide();
      });

      scrubTrack.addEventListener('mousemove', function (e) {
        const rect = scrubTrack.getBoundingClientRect();
        if (rect.width <= 0) return;
        const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        const previewSec = frac * getDuration();
        hoverPreview.textContent = formatTimecode(previewSec);
        hoverPreview.style.left = (frac * 100).toFixed(2) + '%';
      });

      transportBar.addEventListener('mouseenter', function () {
        isHoveringControls = true;
        showControlsAndScheduleHide();
      });

      transportBar.addEventListener('mouseleave', function () {
        isHoveringControls = false;
        showControlsAndScheduleHide();
      });

      container.addEventListener('mousemove', function () {
        showControlsAndScheduleHide();
      });

      container.addEventListener('touchstart', function () {
        showControlsAndScheduleHide();
      }, { passive: true });

      video.addEventListener('loadedmetadata', function () {
        updateTimelineUI();
        updateBufferUI();
      });

      video.addEventListener('timeupdate', function () {
        updateTimelineUI();
      });

      video.addEventListener('progress', function () {
        updateBufferUI();
      });

      video.addEventListener('play', function () {
        updatePlayPauseUI();
        showControlsAndScheduleHide();
      });

      video.addEventListener('pause', function () {
        updatePlayPauseUI();
        showControlsAndScheduleHide();
      });

      video.addEventListener('ended', function () {
        updatePlayPauseUI();
        endSlate.classList.add('is-visible');
        showControlsAndScheduleHide();
      });

      window.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          if (e.key !== ' ' && e.key !== 'k' && e.key !== 'K' && e.key !== 'm' && e.key !== 'M' && e.key !== 'f' && e.key !== 'F' && e.key !== 'r' && e.key !== 'R') {
            return;
          }
        }
        const key = e.key;
        if (key === ' ' || key === 'k' || key === 'K') {
          e.preventDefault();
          togglePlayPause();
        } else if (key === 'ArrowRight') {
          e.preventDefault();
          launchOverlay.classList.add('is-dismissed');
          seekRelative(2);
        } else if (key === 'ArrowLeft') {
          e.preventDefault();
          launchOverlay.classList.add('is-dismissed');
          seekRelative(-2);
        } else if (key === 'm' || key === 'M') {
          e.preventDefault();
          toggleMute();
        } else if (key === 'f' || key === 'F') {
          e.preventDefault();
          toggleFullscreen();
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          startPlaybackWithSound(true);
        }
      });

      updateTimelineUI();
      updatePlayPauseUI();
      updateVolumeUI();
    })();
  </script>
</body>
</html>
